[project]
name = "swinad2net"
version = "0.0.1"
description = "This is an archtecture for computer vision based on Atous Dense Net and Swin Transformers."
authors = [
    {name = "Richard Viana",email = "erichardsv1234@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib (>=3.10.7,<4.0.0)",
    "py7zr (>=1.0.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "timm (>=1.0.22,<2.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "torch (>=2.9.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
