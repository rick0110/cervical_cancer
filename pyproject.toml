[project]
name = "swinad2net"
version = "0.0.1"
description = "This is an archtecture for computer vision based on Atous Dense Net and Swin Transformers."
authors = [
    {name = "Richard Viana",email = "erichardsv1234@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "matplotlib (>=3.10.7,<4.0.0)",
    "py7zr (>=1.0.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "tensorboard (>=2.20.0,<3.0.0)",
    "timm (>=1.0.22,<2.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.5,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "torch (>=2.9.1,<3.0.0)"
]
urls = { "Home" = "https://github.com/your-org/swinad2net", "Source" = "https://github.com/your-org/swinad2net", "Issues" = "https://github.com/your-org/swinad2net/issues" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent"
]
keywords = ["computer-vision", "transformer", "pytorch", "swin-transformer", "dense-net"]

[project.optional-dependencies]
dev = [
  "black>=24.1.0,<25.0.0",
  "isort>=5.12.0,<6.0.0",
  "ruff>=0.18.0,<1.0.0",
  "mypy>=1.8.0,<2.0.0",
  "pytest>=7.4.0,<8.0.0",
  "pytest-cov>=4.1.0,<5.0.0",
  "pre-commit>=3.4.0,<4.0.0",
  "tox>=4.7.0,<5.0.0"
]
docs = [
  "sphinx>=6.0.0,<7.0.0",
  "sphinx-rtd-theme>=1.2.0,<2.0.0",
  "myst-parser>=0.19.0,<1.0.0"
]
test = [
  "pytest>=7.4.0,<8.0.0",
  "pytest-cov>=4.1.0,<5.0.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["swinad2net"]

[tool.mypy]
python_version = 3.12
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
